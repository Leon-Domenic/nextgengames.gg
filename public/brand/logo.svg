<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#129af0" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#logoShadow)">
    <!-- Aerodynamic Badge Icon -->
    <g transform="translate(10, 15)">
      <polygon points="45,0 90,45 45,90 0,45" fill="#129af0" />
      <polygon points="45,10 78,45 45,80 12,45" fill="#0c0d1d" />
      <circle cx="45" cy="45" r="16" fill="#129af0" />
      <circle cx="45" cy="45" r="8" fill="#ffffff" />
    </g>

    <!-- Stylized Geometric Wordmark: PROJECT -->
    <text x="120" y="85" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" letter-spacing="10" fill="url(#logoGrad)">PROJECT</text>
    
    <!-- Stylized Giant Geometric "X" with aerospace cuts -->
    <g transform="translate(630, 8)">
      <polygon points="12,0 38,0 72,50 106,0 132,0 85,62 135,114 108,114 72,68 36,114 10,114 58,62" fill="#129af0" />
      <polygon points="20,8 32,8 72,58 112,8 124,8 84,60 125,106 112,106 72,63 32,106 20,106 60,60" fill="#ffffff" />
      <circle cx="72" cy="62" r="9" fill="#129af0" />
      <circle cx="72" cy="62" r="4.5" fill="#ffffff" />
    </g>
  </g>
</svg>